<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<meta name="theme-color" content="#378ADD">
<title>Mi Agenda Virtual</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f7;
    color: #1c1c1e;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* HEADER */
  .header {
    padding: calc(env(safe-area-inset-top) + 16px) 20px 8px;
    background: #ffffff;
    position: sticky; top: 0; z-index: 5;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .header-top h1 { margin: 0; font-size: 24px; font-weight: 600; }
  .header-top .cal-icon { font-size: 22px; color: #8e8e93; cursor: pointer; }
  .header-sub { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .header-sub .date-label { font-size: 15px; color: #8e8e93; }
  .arrows button {
    background: transparent; border: none; padding: 6px 8px;
    color: #8e8e93; font-size: 20px; cursor: pointer;
  }
  .arrows button:active { color: #378ADD; }

  /* DATE STRIP */
  .date-strip {
    display: flex; gap: 8px; padding: 12px 20px;
    overflow-x: auto; scrollbar-width: none;
  }
  .date-strip::-webkit-scrollbar { display: none; }
  .date-pill {
    flex-shrink: 0;
    min-width: 56px;
    padding: 10px 6px;
    border-radius: 16px;
    text-align: center;
    border: 0.5px solid rgba(0,0,0,0.1);
    background: #ffffff;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .date-pill:active { transform: scale(0.95); }
  .date-pill.active { background: #378ADD; color: white; border-color: #378ADD; }
  .date-pill.today:not(.active) { border-color: #378ADD; }
  .date-pill .dow { font-size: 11px; opacity: 0.7; text-transform: capitalize; }
  .date-pill .dn { font-size: 20px; font-weight: 600; line-height: 1.1; margin: 2px 0; }
  .date-pill .mo { font-size: 10px; opacity: 0.7; text-transform: capitalize; }

  /* SECTION */
  .section-head { padding: 8px 20px 4px; }
  .section-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .section-head p { margin: 2px 0 0; font-size: 13px; color: #8e8e93; }

  /* TASK LIST */
  .task-list { padding: 10px 20px 120px; display: flex; flex-direction: column; gap: 10px; }
  .empty {
    text-align: center; color: #8e8e93; font-size: 14px;
    padding: 40px 20px;
  }
  .task-card {
    background: #ffffff;
    border: 0.5px solid rgba(0,0,0,0.08);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex; gap: 12px; align-items: flex-start;
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-card.done { opacity: 0.55; }
  .task-card.done .t-title { text-decoration: line-through; }
  .check-box {
    width: 22px; height: 22px; border-radius: 5px;
    border: 2px solid var(--accent);
    background: var(--accent-bg);
    cursor: pointer; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .check-box:active { transform: scale(0.88); }
  .check-box.checked { background: var(--accent); }
  .check-box.checked::after { content: "✓"; color: white; font-size: 15px; font-weight: bold; line-height: 1; }
  .t-body { flex: 1; min-width: 0; }
  .t-title { font-size: 14px; font-weight: 600; margin: 0; line-height: 1.35; }
  .t-meta {
    font-size: 12px; color: #6e6e73; margin: 5px 0 0;
    display: flex; align-items: center; gap: 5px;
  }
  .t-meta .ico { font-size: 13px; opacity: 0.8; }
  .msg-btn {
    background: transparent; border: none; padding: 4px;
    color: var(--accent); font-size: 20px; cursor: pointer;
    text-decoration: none;
  }
  .delete-btn {
    background: transparent; border: none; padding: 4px;
    color: #c7c7cc; font-size: 18px; cursor: pointer;
  }
  .delete-btn:active { color: #ff3b30; }
  .quick-row {
    display: flex; align-items: center; gap: 10px;
    background: #f2f2f7; border-radius: 10px; padding: 12px 14px;
  }

  /* FAB */
  .fab {
    position: fixed; right: max(20px, calc((100vw - 480px)/2 + 20px)); bottom: 90px;
    width: 56px; height: 56px; border-radius: 50%;
    background: #378ADD; color: white; border: none;
    font-size: 28px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(55,138,221,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 20; transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.92); }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    max-width: 480px; margin: 0 auto;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
    border-top: 0.5px solid rgba(0,0,0,0.1);
    display: flex; justify-content: space-around;
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    z-index: 15;
  }
  .nav-btn {
    background: transparent; border: none;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; color: #8e8e93; font-size: 11px;
    padding: 4px 12px;
  }
  .nav-btn.active { color: #378ADD; }
  .nav-btn .nav-ico { font-size: 22px; }

  /* MODAL */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    display: none;
    align-items: flex-end; justify-content: center;
    animation: fadeIn 0.2s ease;
  }
  .modal-bg.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #ffffff;
    width: 100%; max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .modal-head h2 { margin: 0; font-size: 19px; font-weight: 600; }
  .modal-head .close {
    background: transparent; border: none; font-size: 24px;
    color: #8e8e93; cursor: pointer; padding: 0; line-height: 1;
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; color: #6e6e73; font-weight: 500; }
  .field input, .field select {
    width: 100%; padding: 12px 14px;
    border-radius: 10px; border: 1px solid rgba(0,0,0,0.12);
    background: #ffffff; font-size: 15px; color: #1c1c1e;
    font-family: inherit;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: #378ADD;
  }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .color-picker { display: flex; gap: 10px; padding: 4px 0; }
  .color-dot {
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; border: 3px solid transparent;
    transition: transform 0.1s;
  }
  .color-dot:active { transform: scale(0.9); }
  .color-dot.selected { border-color: #1c1c1e; }
  .save-btn {
    width: 100%; padding: 14px;
    background: #378ADD; color: white; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
    font-family: inherit;
  }
  .save-btn:active { background: #2a6db5; }

  /* OTHER TABS */
  .placeholder-tab {
    padding: 60px 30px; text-align: center; color: #8e8e93;
  }
  .placeholder-tab .big-ico { font-size: 60px; margin-bottom: 16px; opacity: 0.4; }
  .placeholder-tab h3 { margin: 0 0 8px; color: #1c1c1e; font-size: 18px; }
  .placeholder-tab p { margin: 0; font-size: 14px; line-height: 1.5; }

  /* Contact list */
  .contact-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: #378ADD; color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 15px;
  }
  .contact-info { flex: 1; }
  .contact-info .name { font-size: 15px; font-weight: 500; margin: 0; }
  .contact-info .sub { font-size: 12px; color: #8e8e93; margin: 2px 0 0; }
</style>
</head>
<body>

<!-- ====== AGENDA TAB ====== -->
<div id="tab-agenda">
  <div class="header">
    <div class="header-top">
      <h1>Mi Agenda Virtual</h1>
      <span class="cal-icon" onclick="goToToday()">📅</span>
    </div>
    <div class="header-sub">
      <span class="date-label" id="header-date">—</span>
      <div class="arrows">
        <button onclick="shiftWeek(-1)" aria-label="Anterior">‹</button>
        <button onclick="shiftWeek(1)" aria-label="Siguiente">›</button>
      </div>
    </div>
  </div>

  <div class="date-strip" id="date-strip"></div>

  <div class="section-head">
    <h2>Tareas del Día</h2>
    <p><span id="pending-count">0</span> Pendientes | <span id="done-count">0</span> Completadas</p>
  </div>

  <div class="task-list" id="task-list"></div>
</div>

<!-- ====== CALENDAR TAB ====== -->
<div id="tab-cal" style="display:none;">
  <div class="placeholder-tab">
    <div class="big-ico">📅</div>
    <h3>Vista de Calendario</h3>
    <p>Aquí irá la vista mensual completa.<br>Por ahora usa la franja de días en Agenda.</p>
  </div>
</div>

<!-- ====== TAREAS TAB (all tasks) ====== -->
<div id="tab-tareas" style="display:none;">
  <div class="header">
    <div class="header-top"><h1>Todas las Tareas</h1></div>
  </div>
  <div class="task-list" id="all-tasks-list" style="padding-top: 20px;"></div>
</div>

<!-- ====== CONTACTOS TAB ====== -->
<div id="tab-contactos" style="display:none;">
  <div class="header">
    <div class="header-top"><h1>Contactos</h1></div>
  </div>
  <div id="contacts-list" style="padding-top: 10px;"></div>
</div>

<!-- ====== PERFIL TAB ====== -->
<div id="tab-perfil" style="display:none;">
  <div class="placeholder-tab">
    <div class="big-ico">👤</div>
    <h3>Tu Perfil</h3>
    <p>Tus tareas se guardan automáticamente en tu navegador.<br><br>
    <button onclick="exportData()" class="save-btn" style="max-width:240px;">Exportar mis tareas</button><br>
    <button onclick="clearAllData()" style="background:transparent; color:#ff3b30; border:none; margin-top:14px; font-size:14px; cursor:pointer;">Borrar todos los datos</button></p>
  </div>
</div>

<!-- FAB -->
<button class="fab" onclick="openAddModal()" aria-label="Añadir tarea">+</button>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="agenda" onclick="switchTab('agenda')">
    <span class="nav-ico">📋</span>Agenda
  </button>
  <button class="nav-btn" data-tab="cal" onclick="switchTab('cal')">
    <span class="nav-ico">📅</span>Calendario
  </button>
  <button class="nav-btn" data-tab="tareas" onclick="switchTab('tareas')">
    <span class="nav-ico">✓</span>Tareas
  </button>
  <button class="nav-btn" data-tab="contactos" onclick="switchTab('contactos')">
    <span class="nav-ico">👥</span>Contactos
  </button>
  <button class="nav-btn" data-tab="perfil" onclick="switchTab('perfil')">
    <span class="nav-ico">👤</span>Perfil
  </button>
</nav>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this) closeAddModal()">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Nueva tarea</h2>
      <button class="close" onclick="closeAddModal()">✕</button>
    </div>

    <div class="field">
      <label>Título *</label>
      <input type="text" id="f-title" placeholder="Ej. Reunión con cliente">
    </div>

    <div class="row">
      <div class="field">
        <label>Hora inicio</label>
        <input type="time" id="f-start">
      </div>
      <div class="field">
        <label>Hora fin</label>
        <input type="time" id="f-end">
      </div>
    </div>

    <div class="field">
      <label>⏰ Hora límite para completar</label>
      <input type="time" id="f-deadline">
    </div>

    <div class="field">
      <label>Tipo de acción</label>
      <select id="f-action">
        <option value="">— Ninguna —</option>
        <option value="Contactar">Contactar</option>
        <option value="Responder">Responder</option>
        <option value="Llamar">Llamar</option>
        <option value="Escribir">Escribir</option>
        <option value="Reunirse">Reunirse</option>
      </select>
    </div>

    <div class="field">
      <label>👤 A quién (nombre + email/teléfono)</label>
      <input type="text" id="f-contact" placeholder="Ej. María García | maria@mail.co">
    </div>

    <div class="field">
      <label>Categoría / color</label>
      <div class="color-picker" id="color-picker">
        <div class="color-dot selected" data-color="blue"   style="background:#378ADD;" onclick="selectColor(this)"></div>
        <div class="color-dot"          data-color="amber"  style="background:#EF9F27;" onclick="selectColor(this)"></div>
        <div class="color-dot"          data-color="green"  style="background:#97C459;" onclick="selectColor(this)"></div>
        <div class="color-dot"          data-color="purple" style="background:#7F77DD;" onclick="selectColor(this)"></div>
        <div class="color-dot"          data-color="pink"   style="background:#D4537E;" onclick="selectColor(this)"></div>
        <div class="color-dot"          data-color="gray"   style="background:#888780;" onclick="selectColor(this)"></div>
      </div>
    </div>

    <button class="save-btn" onclick="saveTask()">Guardar tarea</button>
  </div>
</div>

<script>
/* ============ DATA LAYER ============ */
const STORAGE_KEY = 'mi-agenda-v1';
const palette = {
  blue:   { accent:'#378ADD', bg:'#E6F1FB' },
  amber:  { accent:'#EF9F27', bg:'#FAEEDA' },
  green:  { accent:'#97C459', bg:'#EAF3DE' },
  purple: { accent:'#7F77DD', bg:'#EEEDFE' },
  pink:   { accent:'#D4537E', bg:'#FBEAF0' },
  gray:   { accent:'#888780', bg:'#F1EFE8' }
};
const monthShort = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const monthFull  = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const dowShort   = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const dowFull    = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

let state = loadState();
let selectedDate = new Date();
let weekAnchor   = new Date(); // center of the 5-day strip
let editingId    = null;
let selectedColor = 'blue';

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  } catch(e){}
  // Seed with example tasks for today
  const today = new Date();
  const k = dateKey(today);
  return {
    tasks: {
      [k]: [
        { id:1, title:'Reunión Equipo de Proyecto', start:'09:00', end:'11:30', deadline:'11:30', action:'Contactar', contact:'Juan Pérez | @juan_perez', color:'blue',  done:false },
        { id:2, title:'Redactar Informe Trimestral', start:'14:00', end:'15:30', deadline:'17:00', action:'Responder', contact:'María García | maria.g@mail.co', color:'amber', done:false },
        { id:3, title:'Llamar Cliente - Seguimiento', start:'16:00', end:'16:45', deadline:'16:45', action:'Llamar',    contact:'Sr. Gómez | +502 5555 1234',     color:'green', done:false },
        { id:4, title:'Comprar suministros de oficina', start:'', end:'', deadline:'', action:'', contact:'', color:'gray', done:false }
      ]
    },
    nextId: 5
  };
}

function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

function dateKey(d){ return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function sameDay(a,b){ return dateKey(a) === dateKey(b); }

/* ============ RENDER ============ */
function renderHeader(){
  document.getElementById('header-date').textContent =
    `${dowFull[selectedDate.getDay()]}, ${selectedDate.getDate()} ${monthFull[selectedDate.getMonth()]}`;
}

function renderDateStrip(){
  const strip = document.getElementById('date-strip');
  strip.innerHTML = '';
  const today = new Date();
  for(let i=-2; i<=2; i++){
    const d = new Date(weekAnchor);
    d.setDate(weekAnchor.getDate() + i);
    const pill = document.createElement('div');
    pill.className = 'date-pill';
    if(sameDay(d, selectedDate)) pill.classList.add('active');
    if(sameDay(d, today)) pill.classList.add('today');
    pill.innerHTML = `
      <div class="dow">${dowShort[d.getDay()]}</div>
      <div class="dn">${d.getDate()}</div>
      <div class="mo">${monthShort[d.getMonth()]}</div>
    `;
    pill.onclick = () => {
      selectedDate = new Date(d);
      renderAgenda();
    };
    strip.appendChild(pill);
  }
}

function renderTasks(){
  const list = document.getElementById('task-list');
  list.innerHTML = '';
  const dayTasks = (state.tasks[dateKey(selectedDate)] || []).slice()
    .sort((a,b) => (a.start||'99') > (b.start||'99') ? 1 : -1);
  let pending = 0, done = 0;
  dayTasks.forEach(t => t.done ? done++ : pending++);
  document.getElementById('pending-count').textContent = pending;
  document.getElementById('done-count').textContent = done;

  if(dayTasks.length === 0){
    list.innerHTML = `<div class="empty">
      Sin tareas para este día.<br>Toca el botón <b style="color:#378ADD;">+</b> para añadir una.
    </div>`;
    return;
  }

  dayTasks.forEach(t => list.appendChild(buildCard(t)));
}

function buildCard(t){
  const p = palette[t.color] || palette.blue;
  const card = document.createElement('div');
  const isQuick = !t.start && !t.deadline && !t.contact;

  if(isQuick){
    card.className = 'quick-row';
    card.innerHTML = `
      <div class="check-box ${t.done?'checked':''}" style="--accent:${p.accent}; --accent-bg:${p.bg};" data-id="${t.id}"></div>
      <span style="flex:1; font-size:14px; ${t.done?'text-decoration:line-through;opacity:0.55;':''}">${escapeHtml(t.title)}</span>
      <button class="delete-btn" data-del="${t.id}">🗑</button>
    `;
  } else {
    card.className = 'task-card' + (t.done ? ' done' : '');
    card.style.setProperty('--accent', p.accent);
    card.style.setProperty('--accent-bg', p.bg);
    const timeStr = t.start && t.end ? `${t.start} - ${t.end} | ` : (t.start ? `${t.start} | ` : '');
    const contactHtml = t.contact
      ? `<p class="t-meta"><span class="ico">👤</span> ${escapeHtml(t.action || 'Contactar')}: ${escapeHtml(t.contact)}</p>`
      : '';
    const deadlineHtml = t.deadline
      ? `<p class="t-meta"><span class="ico">⏰</span> Hora Límite: ${t.deadline}</p>`
      : '';
    const msgBtn = t.contact ? buildContactBtn(t, p.accent) : '';
    card.innerHTML = `
      <div class="check-box ${t.done?'checked':''}" data-id="${t.id}"></div>
      <div class="t-body">
        <p class="t-title">${timeStr}${escapeHtml(t.title)}</p>
        ${deadlineHtml}
        ${contactHtml}
      </div>
      <div style="display:flex; flex-direction:column; gap:2px; align-items:center;">
        ${msgBtn}
        <button class="delete-btn" data-del="${t.id}">🗑</button>
      </div>
    `;
  }

  card.querySelectorAll('.check-box').forEach(cb => {
    cb.onclick = (e) => { e.stopPropagation(); toggleTask(+cb.dataset.id); };
  });
  card.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); deleteTask(+b.dataset.del); };
  });
  card.onclick = () => openEditModal(t.id);
  return card;
}

function buildContactBtn(t, color){
  const c = t.contact || '';
  // Try to detect phone or email for tap-to-action
  const phone = c.match(/[+]?[\d\s\-]{7,}/);
  const email = c.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
  if(phone && (t.action === 'Llamar' || !email)){
    return `<a class="msg-btn" href="tel:${phone[0].replace(/\s/g,'')}" onclick="event.stopPropagation()">📞</a>`;
  }
  if(email){
    return `<a class="msg-btn" href="mailto:${email[0]}" onclick="event.stopPropagation()">✉️</a>`;
  }
  return `<span class="msg-btn">💬</span>`;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

/* ============ ACTIONS ============ */
function toggleTask(id){
  for(const k in state.tasks){
    const t = state.tasks[k].find(x => x.id === id);
    if(t){ t.done = !t.done; saveState(); renderAgenda(); renderAllTasks(); return; }
  }
}
function deleteTask(id){
  if(!confirm('¿Borrar esta tarea?')) return;
  for(const k in state.tasks){
    const idx = state.tasks[k].findIndex(x => x.id === id);
    if(idx >= 0){
      state.tasks[k].splice(idx,1);
      if(state.tasks[k].length === 0) delete state.tasks[k];
      saveState(); renderAgenda(); renderAllTasks(); renderContacts(); return;
    }
  }
}
function shiftWeek(dir){
  weekAnchor.setDate(weekAnchor.getDate() + dir*5);
  renderDateStrip();
}
function goToToday(){
  selectedDate = new Date();
  weekAnchor   = new Date();
  renderAgenda();
}

/* ============ MODAL ============ */
function openAddModal(){
  editingId = null;
  document.getElementById('modal-title').textContent = 'Nueva tarea';
  document.getElementById('f-title').value = '';
  document.getElementById('f-start').value = '';
  document.getElementById('f-end').value = '';
  document.getElementById('f-deadline').value = '';
  document.getElementById('f-action').value = '';
  document.getElementById('f-contact').value = '';
  selectColorByName('blue');
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(() => document.getElementById('f-title').focus(), 300);
}
function openEditModal(id){
  for(const k in state.tasks){
    const t = state.tasks[k].find(x => x.id === id);
    if(t){
      editingId = id;
      document.getElementById('modal-title').textContent = 'Editar tarea';
      document.getElementById('f-title').value = t.title;
      document.getElementById('f-start').value = t.start || '';
      document.getElementById('f-end').value = t.end || '';
      document.getElementById('f-deadline').value = t.deadline || '';
      document.getElementById('f-action').value = t.action || '';
      document.getElementById('f-contact').value = t.contact || '';
      selectColorByName(t.color || 'blue');
      document.getElementById('modal-bg').classList.add('show');
      return;
    }
  }
}
function closeAddModal(){ document.getElementById('modal-bg').classList.remove('show'); }
function selectColor(el){
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = el.dataset.color;
}
function selectColorByName(name){
  document.querySelectorAll('.color-dot').forEach(d => {
    d.classList.toggle('selected', d.dataset.color === name);
  });
  selectedColor = name;
}
function saveTask(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ alert('Ponle un título a la tarea'); return; }
  const data = {
    title,
    start:    document.getElementById('f-start').value,
    end:      document.getElementById('f-end').value,
    deadline: document.getElementById('f-deadline').value,
    action:   document.getElementById('f-action').value,
    contact:  document.getElementById('f-contact').value.trim(),
    color:    selectedColor,
    done:     false
  };
  const k = dateKey(selectedDate);
  if(editingId){
    for(const dk in state.tasks){
      const t = state.tasks[dk].find(x => x.id === editingId);
      if(t){ Object.assign(t, data); break; }
    }
  } else {
    if(!state.tasks[k]) state.tasks[k] = [];
    state.tasks[k].push({ id: state.nextId++, ...data });
  }
  saveState();
  closeAddModal();
  renderAgenda();
  renderAllTasks();
  renderContacts();
}

/* ============ TABS ============ */
function switchTab(name){
  ['agenda','cal','tareas','contactos','perfil'].forEach(t => {
    document.getElementById('tab-' + t).style.display = (t === name ? 'block' : 'none');
  });
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  if(name === 'tareas') renderAllTasks();
  if(name === 'contactos') renderContacts();
}

function renderAllTasks(){
  const list = document.getElementById('all-tasks-list');
  if(!list) return;
  list.innerHTML = '';
  const all = [];
  for(const k in state.tasks){
    state.tasks[k].forEach(t => all.push({ ...t, _dateKey: k }));
  }
  if(all.length === 0){
    list.innerHTML = `<div class="empty">No tienes tareas todavía.</div>`;
    return;
  }
  all.sort((a,b) => {
    const da = a._dateKey.split('-').map(Number);
    const db = b._dateKey.split('-').map(Number);
    return new Date(da[0],da[1],da[2]) - new Date(db[0],db[1],db[2]);
  });
  let lastDate = null;
  all.forEach(t => {
    if(t._dateKey !== lastDate){
      const [y,m,d] = t._dateKey.split('-').map(Number);
      const dt = new Date(y,m,d);
      const h = document.createElement('div');
      h.style.cssText = 'padding: 12px 0 6px; font-size:13px; font-weight:600; color:#8e8e93;';
      h.textContent = `${dowFull[dt.getDay()]} ${d} ${monthFull[m]}`;
      list.appendChild(h);
      lastDate = t._dateKey;
    }
    list.appendChild(buildCard(t));
  });
}

function renderContacts(){
  const wrap = document.getElementById('contacts-list');
  if(!wrap) return;
  const map = new Map();
  for(const k in state.tasks){
    state.tasks[k].forEach(t => {
      if(t.contact){
        const name = t.contact.split('|')[0].trim();
        const detail = (t.contact.split('|')[1] || '').trim();
        if(!map.has(name)) map.set(name, { name, detail, count: 0 });
        map.get(name).count++;
      }
    });
  }
  if(map.size === 0){
    wrap.innerHTML = `<div class="empty">Los contactos que añadas a tus tareas aparecerán aquí.</div>`;
    return;
  }
  wrap.innerHTML = '';
  Array.from(map.values()).sort((a,b) => b.count - a.count).forEach(c => {
    const initials = c.name.split(' ').map(s => s[0]).slice(0,2).join('').toUpperCase();
    const row = document.createElement('div');
    row.className = 'contact-item';
    row.innerHTML = `
      <div class="avatar">${initials}</div>
      <div class="contact-info">
        <p class="name">${escapeHtml(c.name)}</p>
        <p class="sub">${escapeHtml(c.detail)} · ${c.count} tarea${c.count>1?'s':''}</p>
      </div>
    `;
    wrap.appendChild(row);
  });
}

/* ============ EXPORT / RESET ============ */
function exportData(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mi-agenda-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function clearAllData(){
  if(!confirm('¿Borrar TODAS tus tareas? Esta acción no se puede deshacer.')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = loadState();
  renderAgenda(); renderAllTasks(); renderContacts();
}

/* ============ INIT ============ */
function renderAgenda(){ renderHeader(); renderDateStrip(); renderTasks(); }
renderAgenda();
</script>
